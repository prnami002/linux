name: 🛡️ CYNET Cloud Kali Linux

on:
  workflow_dispatch:

jobs:
  launch-kali:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📦 Setup Kali Linux Engine & Web Terminal (TTYD)
        run: |
          # دانلود سریع ابزارهای ارتباطی
          sudo wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          sudo wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          # اجرای فوری کانتینر رسمی کالی لینوکس
          docker run -d \
            --name cynet-kali \
            --privileged \
            --network host \
            -v /root:/root \
            kalilinux/kali-rolling \
            tail -f /dev/null

      - name: 🌐 Launch Interactive Web Terminal & Public Link
        run: |
          # اجرای وب‌ترمینال
          ttyd -W -p 7681 -t fontSize=16 -t theme='{"background": "#0f172a", "foreground": "#38bdf8", "cursor": "#38bdf8"}' docker exec -it cynet-kali /bin/bash > /dev/null 2>&1 &
          sleep 3

          # راه‌اندازی تونل کلودفلر
          cloudflared tunnel --url http://localhost:7681 > tunnel.log 2>&1 &
          
          sleep 6
          for i in {1..25}; do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo ""
              echo "=========================================================="
              echo "  🔥 YOUR KALI LINUX WEB TERMINAL IS READY!"
              echo "  👉 CLICK LINK TO OPEN: $URL"
              echo "=========================================================="
              echo ""
              break
            fi
            sleep 2
          done

          tail -f tunnel.log
