name: prxcore Beast Workstation & Ultra Low-Latency Remote Browser (KasmVNC + Xray)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      PRX_DOMAIN: ${{ secrets.PRX_DOMAIN }}
      PRX_UUID: ${{ secrets.PRX_UUID }}
      PRX_USER_PASS: ${{ secrets.PRX_USER_PASS }}

    steps:
      - name: 1. Validate Secrets & Deep Kernel Network Tuning (BBR + FastOpen + Low-Latency TCP)
        run: |
          # --- اعتبارسنجی سکرت‌ها ---
          if [ -z "$CF_TOKEN" ] || [ -z "$PRX_DOMAIN" ] || [ -z "$PRX_UUID" ] || [ -z "$PRX_USER_PASS" ]; then
            echo "❌ خطا: لطفاً مطمئن شوید تمام سکرت‌ها (CF_TUNNEL_TOKEN, PRX_DOMAIN, PRX_UUID, PRX_USER_PASS) در تنظیمات گیت‌هاب تعریف شده‌اند."
            exit 1
          fi
          echo "✅ تمام سکرت‌ها تأیید شدند."

          # --- فعال‌سازی ماژول BBR در هسته لینوکس ---
          sudo modprobe tcp_bbr 2>/dev/null || true
          echo "tcp_bbr" | sudo tee -a /etc/modules-load.d/bbr.conf > /dev/null

          # --- بهینه‌سازی تهاجمی کرنل برای کاهش لیتنسی و بهره‌برداری از سخت‌افزار و پهنای باند غول ---
          sudo tee /etc/sysctl.d/99-prxcore-optimize.conf > /dev/null <<'SYSCTL'
          # === BBR Congestion Control ===
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr

          # === TCP Fast Open همزمان برای ارسال و دریافت سریع دسکتاپ ===
          net.ipv4.tcp_fastopen = 3

          # === حذف وقفه Slow Start پس از بی‌کاری سوکت ===
          net.ipv4.tcp_slow_start_after_idle = 0

          # === کاهش فوق‌العاده Bufferbloat و لیتنسی ریموت دسکتاپ (فوری‌ترین پاسخ به موس/کیبورد) ===
          net.ipv4.tcp_notsent_lowat = 16384

          # === بافرهای غول‌پیکر شبکه (۶۴ مگابایت) برای نرخ فریم و کیفیت تصویر ۶۰fps ===
          net.core.rmem_default = 2097152
          net.core.rmem_max = 67108864
          net.core.wmem_default = 2097152
          net.core.wmem_max = 67108864
          net.ipv4.tcp_rmem = 4096 2097152 67108864
          net.ipv4.tcp_wmem = 4096 2097152 67108864
          net.core.somaxconn = 65535
          net.core.netdev_max_backlog = 250000
          net.core.optmem_max = 65536

          # === تنظیمات Window Scaling و ریکاوری بلادرنگ پکت‌ها ===
          net.ipv4.tcp_window_scaling = 1
          net.ipv4.tcp_adv_win_scale = -2
          net.ipv4.tcp_sack = 1
          net.ipv4.tcp_dsack = 1
          net.ipv4.tcp_timestamps = 1
          net.ipv4.tcp_no_metrics_save = 1
          net.ipv4.tcp_frto = 2
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_max_tw_buckets = 2000000

          # === Keepalive بهینه (تست سلامت سریع کانکشن) ===
          net.ipv4.tcp_keepalive_time = 45
          net.ipv4.tcp_keepalive_intvl = 5
          net.ipv4.tcp_keepalive_probes = 6

          # === امنیت و صف ورودی بالا ===
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_syn_backlog = 65535
          net.ipv4.tcp_mtu_probing = 1
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.tcp_ecn = 0

          # === ARP و غیرفعال‌سازی IPv6 برای مسیردهی مستقیم ===
          net.ipv4.neigh.default.gc_thresh1 = 1024
          net.ipv4.neigh.default.gc_thresh2 = 4096
          net.ipv4.neigh.default.gc_thresh3 = 8192
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          SYSCTL

          sudo sysctl --system > /dev/null 2>&1
          echo "✅ تنظیمات کرنل، BBR و کاهش لیتنسی اعمال شدند."

      - name: 2. Setup Secure User, Dependencies & Deploy Extreme Kasm Chromium
        run: |
          sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:$PRX_USER_PASS" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore > /dev/null

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            neofetch htop tmux curl wget nginx qrencode jq -qq

          # دانلود ttyd
          sudo wget -q -nc https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          # دانلود cloudflared
          sudo wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # اجرای کانتینر ریموت بروزر فوق‌سریع بر پایه KasmVNC با احراز هویت و حداکثر منابع
          # ۸ گیگابایت حافظه اشتراکی + استفاده از تمام ترد‌های CPU برای رندر فوری
          sudo docker run -d \
            --name=kasm-chrome \
            -p 127.0.0.1:3000:3000 \
            --shm-size=8g \
            --ipc=host \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e LC_ALL=en_US.UTF-8 \
            -e CUSTOM_USER=prxcore \
            -e PASSWORD="$PRX_USER_PASS" \
            -e CHROME_CLI="--no-sandbox --disable-dev-shm-usage --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding --num-raster-threads=8 --enable-accelerated-2d-canvas --enable-features=CanvasOopRasterization" \
            --restart unless-stopped \
            lscr.io/linuxserver/chromium:latest

          # کاهش سرعت اسکرول عمودی با imwheel
          sleep 5
          sudo docker exec kasm-chrome bash -c "apt-get update -qq && apt-get install -y -qq imwheel > /dev/null 2>&1 && mkdir -p /home/prxcore && printf '\".*\"\nNone,      Up,   Button4, 1\nNone,      Down, Button5, 1\n' > /home/prxcore/.imwheelrc && chown -R 1000:1000 /home/prxcore/.imwheelrc && (su - abc -c 'imwheel -b 45' 2>/dev/null || imwheel -b 45)"

          echo "✅ تمام پیش‌نیازها و کانتینر ریموت بروزر با موفقیت مستقر شدند."

      - name: 3. Install & Configure Xray-Core (Fully Optimized VLESS WS)
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          sudo mkdir -p /usr/local/etc/xray
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json
          {
            "log": {
              "loglevel": "none",
              "access": "none"
            },
            "dns": {
              "servers": [
                {
                  "address": "1.1.1.1",
                  "skipFallback": true
                },
                "8.8.8.8"
              ],
              "queryStrategy": "UseIPv4",
              "disableCache": false
            },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$PRX_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/prx-stream",
                    "headers": {
                      "Host": "$PRX_DOMAIN"
                    },
                    "heartbeatPeriod": 30
                  },
                  "sockopt": {
                    "mark": 255,
                    "tcpFastOpen": true,
                    "tcpNoDelay": true,
                    "tcpKeepAliveInterval": 10,
                    "tcpKeepAliveIdle": 15,
                    "tcpMptcp": false,
                    "tcpCongestion": "bbr",
                    "domainStrategy": "UseIPv4"
                  }
                },
                "sniffing": {
                  "enabled": true,
                  "destOverride": ["http", "tls"],
                  "routeOnly": true
                }
              }
            ],
            "outbounds": [
              {
                "tag": "direct",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIPv4"
                },
                "streamSettings": {
                  "sockopt": {
                    "mark": 255,
                    "tcpFastOpen": true,
                    "tcpNoDelay": true,
                    "tcpCongestion": "bbr"
                  }
                }
              },
              {
                "tag": "block",
                "protocol": "blackhole",
                "settings": {
                  "response": {
                    "type": "http"
                  }
                }
              }
            ],
            "routing": {
              "domainStrategy": "IPIfNonMatch",
              "rules": [
                {
                  "type": "field",
                  "outboundTag": "block",
                  "protocol": ["bittorrent"]
                },
                {
                  "type": "field",
                  "outboundTag": "direct",
                  "network": "tcp,udp"
                }
              ]
            },
            "policy": {
              "levels": {
                "0": {
                  "handshake": 5,
                  "connIdle": 300,
                  "uplinkOnly": 2,
                  "downlinkOnly": 5,
                  "bufferSize": 4096
                }
              },
              "system": {
                "statsOutboundUplink": false,
                "statsOutboundDownlink": false
              }
            }
          }
          EOF

          sudo systemctl enable xray
          sudo systemctl restart xray
          sleep 2

          if sudo systemctl is-active --quiet xray; then
            echo "✅ Xray با موفقیت اجرا شد."
          else
            echo "❌ خطا در اجرای Xray:"
            sudo journalctl -u xray --no-pager -n 20
            exit 1
          fi

      - name: 4. Configure Nginx Ultra Multiplexer (No-Lag WebSocket & Map Handling)
        run: |
          cat <<'MAIN' | sudo tee /etc/nginx/nginx.conf
          user www-data;
          worker_processes auto;
          worker_rlimit_nofile 131072;
          pid /run/nginx.pid;

          events {
              worker_connections 16384;
              multi_accept on;
              use epoll;
          }

          http {
              # === تعریف نقشه داینامیک وب‌سوکت برای لود بدون نقص فایل‌های استاتیک و استریم ===
              map $http_upgrade $connection_upgrade {
                  default upgrade;
                  '' close;
              }

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              types_hash_max_size 2048;
              server_tokens off;

              keepalive_timeout 120;
              keepalive_requests 100000;

              proxy_buffer_size 32k;
              proxy_buffers 8 64k;
              proxy_busy_buffers_size 128k;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
          MAIN

          cat <<'SITE' | sudo tee /etc/nginx/sites-available/default
          upstream xray_backend {
              server 127.0.0.1:8080;
              keepalive 256;
          }

          upstream ttyd_backend {
              server 127.0.0.1:7681;
              keepalive 64;
          }

          upstream kasm_backend {
              server 127.0.0.1:3000;
              keepalive 256;
          }

          server {
              listen 8000 default_server reuseport;
              server_name _;
              client_max_body_size 0;

              # === ۱. مسیر پروکسی فیلترشکن VLESS WS (بدون لاگ دیسک) ===
              location /prx-stream {
                  access_log off;
                  proxy_redirect off;
                  proxy_pass http://xray_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === ۲. مسیر وب‌ترمینال لینوکس (ttyd) ===
              location ^~ /terminal/ {
                  proxy_pass http://ttyd_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                  proxy_buffering off;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === ۳. مسیر اصلی: ریموت بروزر پرسرعت Kasm Chromium (بلادرنگ و بدون تاخیر) ===
              location / {
                  proxy_pass http://kasm_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  # خاموش کردن بافرینگ برای دریافت آنی فریم‌های تصویر و موس
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === ۴. وضعیت سلامت سرور ===
              location /health {
                  access_log off;
                  default_type application/json;
                  return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
              }
          }
          SITE

          sudo nginx -t
          if [ $? -eq 0 ]; then
            sudo systemctl restart nginx
            echo "✅ Nginx مالتی‌پلکسر با بهینه‌سازی جدید اجرا شد."
          else
            echo "❌ خطا در کانفیگ Nginx!"
            exit 1
          fi

      - name: 5. Launch Services & Smart Cloudflare Tunnel (Advanced Auto-Fallback)
        run: |
          # اجرای ttyd روی پورت 7681 با پیشوند مسیر /terminal
          sudo nohup /usr/local/bin/ttyd \
            -c "prxcore:$PRX_USER_PASS" \
            -W \
            -p 7681 \
            -b /terminal \
            -t fontSize=16 \
            -t 'theme={"background": "#0f172a"}' \
            -t rendererType=webgl \
            tmux new-session -A -s prxcore_workspace > /tmp/ttyd.log 2>&1 &
          sleep 2

          # شروع تونل با پروتکل QUIC
          CURRENT_PROTO="quic"
          echo "$CURRENT_PROTO" > /tmp/cf_proto.txt

          sudo nohup /usr/local/bin/cloudflared tunnel \
            --protocol $CURRENT_PROTO \
            --url http://127.0.0.1:8000 \
            --no-autoupdate \
            --edge-ip-version 4 \
            --grace-period 10s \
            --retries 15 \
            run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
          CF_PID=$!
          sleep 5

          if ps -p $CF_PID > /dev/null 2>&1; then
            echo "✅ Cloudflare Tunnel با پروتکل $CURRENT_PROTO اجرا شد (PID: $CF_PID)"
          else
            echo "⚠️ QUIC ناموفق — فالبک فوری به HTTP/2..."
            CURRENT_PROTO="http2"
            echo "$CURRENT_PROTO" > /tmp/cf_proto.txt
            sudo nohup /usr/local/bin/cloudflared tunnel \
              --protocol $CURRENT_PROTO \
              --url http://127.0.0.1:8000 \
              --no-autoupdate \
              --edge-ip-version 4 \
              --grace-period 10s \
              --retries 15 \
              run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
            sleep 5
            echo "✅ Cloudflare Tunnel با پروتکل $CURRENT_PROTO اجرا شد."
          fi

          # مانیتورینگ هوشمند پایداری تونل
          echo "$CF_TOKEN" > /tmp/.cf_token
          chmod 600 /tmp/.cf_token

          cat <<'MONITOR' | sudo tee /usr/local/bin/tunnel_monitor.sh > /dev/null
          #!/bin/bash
          CF_TOKEN=$(cat /tmp/.cf_token 2>/dev/null)
          ERROR_THRESHOLD=5
          CHECK_INTERVAL=15
          HEALTH_CHECK_URL="http://127.0.0.1:8000/health"
          COOLDOWN=90
          LAST_SWAP=0

          while true; do
            sleep $CHECK_INTERVAL
            NOW=$(date +%s)
            SINCE_SWAP=$((NOW - LAST_SWAP))

            if [ "$SINCE_SWAP" -lt "$COOLDOWN" ]; then
              continue
            fi

            HEALTH=$(curl -sf -m 3 "$HEALTH_CHECK_URL" 2>/dev/null)
            NGINX_OK=$?

            RECENT_ERRORS=$(tail -100 /tmp/cf_tunnel.log 2>/dev/null | grep -ciE "EOF|stream error|timeout|connection reset|quic.*error|http2.*error|register tunnel|server misbehaving")
            CF_ALIVE=$(pgrep -c -f "cloudflared tunnel" 2>/dev/null || echo "0")

            if [ "$NGINX_OK" -ne 0 ]; then
              sudo systemctl restart nginx
            fi

            NEED_SWAP=false
            if [ "$CF_ALIVE" -eq 0 ]; then
              NEED_SWAP=true
            elif [ "$RECENT_ERRORS" -ge "$ERROR_THRESHOLD" ]; then
              NEED_SWAP=true
            fi

            if [ "$NEED_SWAP" = true ]; then
              CURRENT=$(cat /tmp/cf_proto.txt 2>/dev/null || echo "quic")
              if [ "$CURRENT" = "quic" ]; then
                NEXT="http2"
              else
                NEXT="quic"
              fi

              OLD_PID=$(pgrep -f "cloudflared tunnel" | head -1)
              sudo mv /tmp/cf_tunnel.log /tmp/cf_tunnel_old.log 2>/dev/null

              sudo nohup /usr/local/bin/cloudflared tunnel \
                --protocol $NEXT \
                --url http://127.0.0.1:8000 \
                --no-autoupdate \
                --edge-ip-version 4 \
                --grace-period 10s \
                --retries 15 \
                run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
              NEW_PID=$!

              sleep 10
              if ps -p $NEW_PID > /dev/null 2>&1; then
                if [ -n "$OLD_PID" ]; then
                  sudo kill "$OLD_PID" 2>/dev/null
                  sleep 2
                  sudo kill -9 "$OLD_PID" 2>/dev/null
                fi
                echo "$NEXT" > /tmp/cf_proto.txt
                sudo rm -f /tmp/cf_tunnel_old.log 2>/dev/null
                LAST_SWAP=$NOW
              else
                sudo kill "$NEW_PID" 2>/dev/null
                sudo mv /tmp/cf_tunnel_old.log /tmp/cf_tunnel.log 2>/dev/null
              fi
            fi
          done
          MONITOR
          sudo chmod +x /usr/local/bin/tunnel_monitor.sh
          sudo nohup /usr/local/bin/tunnel_monitor.sh > /dev/null 2>&1 &
          echo "✅ مانیتور هوشمند تونل فعال شد."

      - name: 6. Generate Connection Info & 6-Hour Keep Alive
        run: |
          VLESS_LINK="vless://$PRX_UUID@$PRX_DOMAIN:443?path=%2Fprx-stream&security=tls&encryption=none&type=ws&sni=$PRX_DOMAIN&host=$PRX_DOMAIN&alpn=h2%2Chttp%2F1.1&fp=chrome#PRX-Ultra"

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  🎉 ULTRA LOW-LATENCY WORKSTATION & BROWSER ACTIVE!   ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║                                                        ║"
          printf "║  🚀 Remote Browser: https://%s\n" "$PRX_DOMAIN"
          printf "║  💻 Web Terminal:   https://%s/terminal/\n" "$PRX_DOMAIN"
          echo "║  🔐 Login Username: prxcore                            ║"
          echo "║  🔐 Password:       [Defined in PRX_USER_PASS Secret]  ║"
          echo "║                                                        ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  ⚡ Ultra Optimizations Applied:                        ║"
          echo "║    ✅ 8GB Shared RAM (shm) + Host IPC Mode             ║"
          echo "║    ✅ 8 Parallel Raster CPU Threads (Instant Render)   ║"
          echo "║    ✅ TCP_NOTSENT_LOWAT (Zero Bufferbloat / Ultra Low RTT)║"
          echo "║    ✅ BBR Congestion Control + 64MB Massive Buffers    ║"
          echo "║    ✅ Nginx Dynamic Map (Clean HTTP/WebSocket Split)   ║"
          echo "║    ✅ Protected Kasm Authentication (prxcore)          ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🚀 VLESS Connection Link:                             ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "$VLESS_LINK"
          echo ""
          echo "⏱️ سرور تا ۶ ساعت فعال می‌ماند..."
          echo "=================================================="

          for i in $(seq 1 360); do
            sleep 60
            if [ $((i % 10)) -eq 0 ]; then
              PROTO=$(cat /tmp/cf_proto.txt 2>/dev/null || echo "unknown")
              CF_UP=$(pgrep -c -f "cloudflared tunnel" 2>/dev/null || echo "0")
              XRAY_UP=$(pgrep -c -f "xray" 2>/dev/null || echo "0")
              KASM_UP=$(sudo docker inspect -f '{{.State.Running}}' kasm-chrome 2>/dev/null || echo "false")
              echo "[$i/360] 📊 Status: Proto=$PROTO | CF=$CF_UP | Xray=$XRAY_UP | Kasm=$KASM_UP"
            else
              echo "[$i/360] 🟢 Running on $PRX_DOMAIN"
            fi
          done
          echo "⏰ ۶ ساعت تمام شد. سرور خاموش می‌شود."
