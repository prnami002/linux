name: prxcore All-in-One Dedicated Workstation & Proxy (Ultra Edition)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      PRX_DOMAIN: ${{ secrets.PRX_DOMAIN }}
      PRX_UUID: ${{ secrets.PRX_UUID }}
      PRX_USER_PASS: ${{ secrets.PRX_USER_PASS }}

    steps:
      - name: 1. Validate Secrets & Kernel Network Tuning (BBR & FastOpen)
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$PRX_DOMAIN" ] || [ -z "$PRX_UUID" ] || [ -z "$PRX_USER_PASS" ]; then
            echo "❌ خطا: لطفاً مطمئن شوید تمام سکرت‌ها (CF_TUNNEL_TOKEN, PRX_DOMAIN, PRX_UUID, PRX_USER_PASS) در تنظیمات گیت‌هاب تعریف شده‌اند."
            exit 1
          fi

      - name: 2. Setup Secure User & Install Dependencies
        run: |
          sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:$PRX_USER_PASS" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y neofetch htop tmux curl wget nginx qrencode -qq

          # دانلود آخرین نسخه ttyd و cloudflared
          sudo wget -q -nc https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          sudo wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: 3. Install & Configure Xray-Core (Optimized WS + Default DNS Strategy)
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          sudo mkdir -p /usr/local/etc/xray
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$PRX_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/prx-stream",
                    "heartbeatPeriod": 20
                  },
                  "sockopt": {
                    "tcpKeepAliveInterval": 15
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "AsIs"
                }
              }
            ]
          }
          EOF

          sudo systemctl enable xray
          sudo systemctl restart xray

      - name: 4. Configure Nginx Unified Multiplexer (Port 8000)
        run: |
          cat <<'EOF' | sudo tee /etc/nginx/sites-available/default
          server {
              listen 8000 default_server;
              server_name _;
              client_max_body_size 0;

              # مسیر اختصاصی ترافیک پروکسی VLESS WS
              location /prx-stream {
                  proxy_redirect off;
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_buffering off;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }

              # مسیر دسترسی به وب‌ترمینال ایمن
              location / {
                  proxy_pass http://127.0.0.1:7681;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_buffering off;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: 5. Launch Services & Smart Cloudflare Tunnel (Auto-Fallback)
        run: |
          # اجرای وب‌ترمینال محافظت‌شده با احراز هویت
          sudo nohup /usr/local/bin/ttyd -c "prxcore:$PRX_USER_PASS" -W -p 7681 -t fontSize=16 -t theme="{'background': '#0f172a'}" -t rendererType=webgl tmux new-session -A -s prxcore_workspace > /tmp/ttyd.log 2>&1 &
          sleep 2

          # شروع تونل با QUIC (سریع‌ترین پروتکل)
          CURRENT_PROTO="quic"
          sudo nohup /usr/local/bin/cloudflared tunnel --protocol $CURRENT_PROTO --url http://127.0.0.1:8000 --no-autoupdate run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
          CF_PID=$!
          sleep 5

          # اسکریپت مانیتورینگ هوشمند — سوئیچ خودکار از QUIC به HTTP/2
          cat <<'MONITOR' | sudo tee /usr/local/bin/tunnel_monitor.sh > /dev/null
          #!/bin/bash
          ERROR_THRESHOLD=5
          CHECK_INTERVAL=30
          ERROR_COUNT=0

          while true; do
            sleep $CHECK_INTERVAL

            # بررسی ارورهای مرتبط با تونل در لاگ
            RECENT_ERRORS=$(tail -50 /tmp/cf_tunnel.log 2>/dev/null | grep -ciE "EOF|stream error|timeout|connection reset|quic.*error|http2.*error")

            if [ "$RECENT_ERRORS" -ge "$ERROR_THRESHOLD" ]; then
              CURRENT=$(cat /tmp/cf_proto.txt 2>/dev/null || echo "quic")

              # تعیین پروتکل جایگزین
              if [ "$CURRENT" = "quic" ]; then
                NEXT="http2"
              else
                NEXT="quic"
              fi

              echo "$(date) ⚠️ $CURRENT ناپایدار — شروع Hot-Swap به $NEXT..." >> /tmp/tunnel_monitor.log

              # ذخیره PID تونل فعلی
              OLD_PID=$(pgrep -f "cloudflared tunnel")

              # اول تونل جدید رو بالا بیار (بدون کشتن قبلی)
              sudo nohup /usr/local/bin/cloudflared tunnel --protocol $NEXT --url http://127.0.0.1:8000 --no-autoupdate run --token "$CF_TOKEN" > /tmp/cf_tunnel_new.log 2>&1 &
              NEW_PID=$!

              # صبر تا تونل جدید آماده بشه
              sleep 8

              # حالا تونل قدیمی رو بکش
              if [ -n "$OLD_PID" ]; then
                sudo kill "$OLD_PID" 2>/dev/null
              fi

              echo "$NEXT" > /tmp/cf_proto.txt
              sudo cp /tmp/cf_tunnel_new.log /tmp/cf_tunnel.log

              echo "$(date) ✅ Hot-Swap کامل شد — $NEXT فعال (بدون قطعی)" >> /tmp/tunnel_monitor.log
            fi
          done
          MONITOR
          sudo chmod +x /usr/local/bin/tunnel_monitor.sh
          echo "quic" > /tmp/cf_proto.txt

          # اجرای مانیتور در پس‌زمینه
          sudo nohup /usr/local/bin/tunnel_monitor.sh > /dev/null 2>&1 &

      - name: 6. Live Display & 6-Hour Keep Alive
        run: |
          echo "=================================================="
          echo "🎉 ULTRA WORKSTATION & SECURE PROXY IS RUNNING!"
          echo "=================================================="
          echo "🌐 Web Terminal URL: https://$PRX_DOMAIN"
          echo "🔐 Terminal Login: Username: prxcore | Password: [Protected by Secrets]"
          echo "=================================================="
          echo "🚀 VLESS CONFIG LINK:"
          echo "vless://$PRX_UUID@$PRX_DOMAIN:443?path=%2Fprx-stream&security=tls&encryption=none&type=ws&sni=$PRX_DOMAIN&host=$PRX_DOMAIN#PRX-Dedicated"
          echo "=================================================="

          for i in {1..360}; do
            sleep 60
            echo "[$i/360] 🟢 Server running smoothly on $PRX_DOMAIN"
          done
