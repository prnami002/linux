name: prxcore All-in-One Dedicated Workstation & Proxy (Beast Mode Edition)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      PRX_DOMAIN: ${{ secrets.PRX_DOMAIN }}
      PRX_UUID: ${{ secrets.PRX_UUID }}
      PRX_USER_PASS: ${{ secrets.PRX_USER_PASS }}

    steps:
      - name: 1. Validate Secrets & Beast-Mode Kernel Tuning
        run: |
          # --- اعتبارسنجی سکرت‌ها ---
          if [ -z "$CF_TOKEN" ] || [ -z "$PRX_DOMAIN" ] || [ -z "$PRX_UUID" ] || [ -z "$PRX_USER_PASS" ]; then
            echo "❌ خطا: لطفاً مطمئن شوید تمام سکرت‌ها (CF_TUNNEL_TOKEN, PRX_DOMAIN, PRX_UUID, PRX_USER_PASS) در تنظیمات گیت‌هاب تعریف شده‌اند."
            exit 1
          fi
          echo "✅ تمام سکرت‌ها تأیید شدند."

          # --- فعال‌سازی BBR ---
          sudo modprobe tcp_bbr 2>/dev/null || true
          echo "tcp_bbr" | sudo tee -a /etc/modules-load.d/bbr.conf > /dev/null

          # --- BEAST MODE: کرنل بدون هیچ محدودیتی — فقط سرعت و پایداری ---
          sudo tee /etc/sysctl.d/99-prxcore-optimize.conf > /dev/null <<'SYSCTL'
          # === BBR Congestion Control ===
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr

          # === TCP Fast Open ===
          net.ipv4.tcp_fastopen = 3

          # === غیرفعال‌سازی Slow Start بعد از Idle ===
          net.ipv4.tcp_slow_start_after_idle = 0

          # === بافرهای شبکه — 128MB حداکثر (بدون محدودیت) ===
          net.core.rmem_default = 4194304
          net.core.rmem_max = 134217728
          net.core.wmem_default = 4194304
          net.core.wmem_max = 134217728
          net.ipv4.tcp_rmem = 4096 4194304 134217728
          net.ipv4.tcp_wmem = 4096 4194304 134217728
          net.core.somaxconn = 131072
          net.core.netdev_max_backlog = 500000
          net.core.optmem_max = 131072

          # === TCP Window Scaling ===
          net.ipv4.tcp_window_scaling = 1
          net.ipv4.tcp_adv_win_scale = -2

          # === SACK/DSACK/Timestamps — بازیابی سریع + RTT دقیق ===
          net.ipv4.tcp_sack = 1
          net.ipv4.tcp_dsack = 1
          net.ipv4.tcp_timestamps = 1

          # === هر اتصال fresh شروع کنه ===
          net.ipv4.tcp_no_metrics_save = 1

          # === Forward RTO-Recovery ===
          net.ipv4.tcp_frto = 2

          # === کلیدی برای استریم و گیم: tcp_notsent_lowat ===
          # اپلیکیشن‌ها زودتر بیدار میشن برای ارسال دیتا = لیتنسی interactive کمتر
          net.ipv4.tcp_notsent_lowat = 16384

          # === TIME_WAIT — آزادسازی سریع پورت‌ها ===
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_max_tw_buckets = 4000000

          # === TCP Keepalive — پایدار (75 ثانیه تحمل) ===
          net.ipv4.tcp_keepalive_time = 45
          net.ipv4.tcp_keepalive_intvl = 5
          net.ipv4.tcp_keepalive_probes = 6

          # === SYN Cookies + Backlog ===
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_syn_backlog = 131072

          # === MTU Probing ===
          net.ipv4.tcp_mtu_probing = 1

          # === حداکثر اتصالات + سوکت‌های orphan ===
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.tcp_max_orphans = 262144

          # === ECN غیرفعال ===
          net.ipv4.tcp_ecn = 0

          # === عدم abort در overflow — retry بجای drop (پایداری بیشتر) ===
          net.ipv4.tcp_abort_on_overflow = 0

          # === ARP Cache بزرگ ===
          net.ipv4.neigh.default.gc_thresh1 = 2048
          net.ipv4.neigh.default.gc_thresh2 = 8192
          net.ipv4.neigh.default.gc_thresh3 = 16384

          # === حافظه — ترجیح RAM بر Swap ===
          vm.swappiness = 10

          # === غیرفعال‌سازی IPv6 ===
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          SYSCTL

          sudo sysctl --system > /dev/null 2>&1

          # --- افزایش file descriptor limits ---
          sudo bash -c 'cat >> /etc/security/limits.conf' <<EOF
* soft nofile 1048576
* hard nofile 1048576
* soft nproc 1048576
* hard nproc 1048576
EOF
          sudo ulimit -n 1048576 2>/dev/null || true

          # --- تأیید BBR ---
          CURRENT_CC=$(sysctl -n net.ipv4.tcp_congestion_control)
          if [ "$CURRENT_CC" = "bbr" ]; then
            echo "✅ BBR فعال شد: $CURRENT_CC"
          else
            echo "⚠️ BBR فعال نشد — فالبک به: $CURRENT_CC"
          fi

          echo "✅ Beast Mode کرنل فعال شد."

      - name: 2. Setup Secure User & Install Dependencies
        run: |
          sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:$PRX_USER_PASS" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore > /dev/null

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            neofetch htop tmux curl wget nginx qrencode jq -qq

          # دانلود ttyd
          sudo wget -q -nc https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          # دانلود cloudflared
          sudo wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          echo "✅ تمام وابستگی‌ها نصب شدند."

      - name: 3. Install & Configure Xray-Core (Beast Mode VLESS WS)
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          sudo mkdir -p /usr/local/etc/xray
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json
          {
            "log": {
              "loglevel": "none",
              "access": "none"
            },
            "dns": {
              "servers": [
                {
                  "address": "1.1.1.1",
                  "skipFallback": true
                },
                "8.8.8.8"
              ],
              "queryStrategy": "UseIPv4",
              "disableCache": false
            },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$PRX_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/prx-stream",
                    "headers": {
                      "Host": "$PRX_DOMAIN"
                    },
                    "heartbeatPeriod": 5
                  },
                  "sockopt": {
                    "mark": 255,
                    "tcpFastOpen": true,
                    "tcpNoDelay": true,
                    "tcpKeepAliveInterval": 5,
                    "tcpKeepAliveIdle": 15,
                    "tcpMptcp": true,
                    "tcpCongestion": "bbr",
                    "domainStrategy": "UseIPv4"
                  }
                },
                "sniffing": {
                  "enabled": true,
                  "destOverride": ["http", "tls"],
                  "routeOnly": true
                }
              }
            ],
            "outbounds": [
              {
                "tag": "direct",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIPv4"
                },
                "streamSettings": {
                  "sockopt": {
                    "mark": 255,
                    "tcpFastOpen": true,
                    "tcpNoDelay": true,
                    "tcpCongestion": "bbr"
                  }
                }
              },
              {
                "tag": "block",
                "protocol": "blackhole",
                "settings": {
                  "response": {
                    "type": "http"
                  }
                }
              }
            ],
            "routing": {
              "domainStrategy": "IPIfNonMatch",
              "rules": [
                {
                  "type": "field",
                  "outboundTag": "block",
                  "protocol": ["bittorrent"]
                },
                {
                  "type": "field",
                  "outboundTag": "direct",
                  "network": "tcp,udp"
                }
              ]
            },
            "policy": {
              "levels": {
                "0": {
                  "handshake": 3,
                  "connIdle": 600,
                  "uplinkOnly": 2,
                  "downlinkOnly": 4,
                  "bufferSize": 65536
                }
              },
              "system": {
                "statsOutboundUplink": false,
                "statsOutboundDownlink": false
              }
            }
          }
          EOF

          sudo systemctl enable xray
          sudo systemctl restart xray
          sleep 2

          # بررسی اجرای صحیح Xray
          if sudo systemctl is-active --quiet xray; then
            echo "✅ Xray با موفقیت اجرا شد."
          else
            echo "❌ خطا در اجرای Xray:"
            sudo journalctl -u xray --no-pager -n 20
            exit 1
          fi

      - name: 4. Configure Nginx Beast-Mode Multiplexer (Port 8000)
        run: |
          # --- Nginx بدون محدودیت ---
          cat <<'MAIN' | sudo tee /etc/nginx/nginx.conf
          user www-data;
          worker_processes auto;
          worker_rlimit_nofile 262144;
          pid /run/nginx.pid;

          events {
              worker_connections 32768;
              multi_accept on;
              use epoll;
          }

          http {
              # === تنظیمات پایه ===
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              types_hash_max_size 2048;
              server_tokens off;
              reset_timedout_connection on;

              # === Keepalive — اتصالات زنده بمونن ===
              keepalive_timeout 180;
              keepalive_requests 500000;

              # === بافرهای پروکسی حداکثری ===
              proxy_buffer_size 64k;
              proxy_buffers 16 64k;
              proxy_busy_buffers_size 256k;

              # === فشرده‌سازی Gzip ===
              gzip on;
              gzip_vary on;
              gzip_comp_level 4;
              gzip_min_length 256;
              gzip_proxied any;
              gzip_types
                  text/plain
                  text/css
                  text/xml
                  text/javascript
                  application/json
                  application/javascript
                  application/xml
                  application/rss+xml
                  image/svg+xml;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
          MAIN

          # --- کانفیگ سایت ---
          cat <<'SITE' | sudo tee /etc/nginx/sites-available/default
          # Upstream با keepalive حداکثری
          upstream xray_backend {
              server 127.0.0.1:8080;
              keepalive 512;
          }

          upstream ttyd_backend {
              server 127.0.0.1:7681;
              keepalive 128;
          }

          server {
              listen 8000 default_server reuseport;
              server_name _;
              client_max_body_size 0;

              # === VLESS WS — حداکثر سرعت + پایداری ===
              location /prx-stream {
                  proxy_redirect off;
                  proxy_pass http://xray_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  # real-time streaming — بدون بافرینگ
                  proxy_buffering off;
                  proxy_request_buffering off;

                  # تایم‌اوت‌ها
                  proxy_connect_timeout 3s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;

                  # TCP keepalive
                  proxy_socket_keepalive on;
              }

              # === وب‌ترمینال ===
              location / {
                  proxy_pass http://ttyd_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                  proxy_buffering off;
                  proxy_connect_timeout 3s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === Health Check ===
              location /health {
                  access_log off;
                  return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
                  add_header Content-Type application/json;
              }
          }
          SITE

          sudo nginx -t
          if [ $? -eq 0 ]; then
            sudo systemctl restart nginx
            echo "✅ Nginx Beast Mode فعال شد."
          else
            echo "❌ خطا در کانفیگ Nginx!"
            exit 1
          fi

      - name: 5. Launch Services & Smart Cloudflare Tunnel (Advanced Auto-Fallback)
        run: |
          # --- وب‌ترمینال ---
          sudo nohup /usr/local/bin/ttyd \
            -c "prxcore:$PRX_USER_PASS" \
            -W \
            -p 7681 \
            -t fontSize=16 \
            -t 'theme={"background": "#0f172a"}' \
            -t rendererType=webgl \
            tmux new-session -A -s prxcore_workspace > /tmp/ttyd.log 2>&1 &
          sleep 2

          if pgrep -f ttyd > /dev/null; then
            echo "✅ وب‌ترمینال اجرا شد."
          else
            echo "⚠️ خطا در اجرای وب‌ترمینال."
          fi

          # --- تونل Cloudflare با QUIC ---
          CURRENT_PROTO="quic"
          echo "$CURRENT_PROTO" > /tmp/cf_proto.txt

          sudo nohup /usr/local/bin/cloudflared tunnel \
            --protocol $CURRENT_PROTO \
            --url http://127.0.0.1:8000 \
            --no-autoupdate \
            --edge-ip-version 4 \
            --grace-period 25s \
            --retries 20 \
            run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
          CF_PID=$!
          sleep 5

          if ps -p $CF_PID > /dev/null 2>&1; then
            echo "✅ Cloudflare Tunnel با پروتکل $CURRENT_PROTO اجرا شد (PID: $CF_PID)"
          else
            echo "⚠️ QUIC ناموفق — تلاش با HTTP/2..."
            CURRENT_PROTO="http2"
            echo "$CURRENT_PROTO" > /tmp/cf_proto.txt
            sudo nohup /usr/local/bin/cloudflared tunnel \
              --protocol $CURRENT_PROTO \
              --url http://127.0.0.1:8000 \
              --no-autoupdate \
              --edge-ip-version 4 \
              --grace-period 25s \
              --retries 20 \
              run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
            sleep 5
            echo "✅ Cloudflare Tunnel با فالبک $CURRENT_PROTO اجرا شد."
          fi

          # ذخیره توکن برای دسترسی مانیتور (heredoc با single-quote expand نمی‌کنه)
          echo "$CF_TOKEN" > /tmp/.cf_token_ref
          chmod 600 /tmp/.cf_token_ref

          # --- مانیتور هوشمند — محافظه‌کار برای پایداری حداکثری ---
          cat <<'MONITOR' | sudo tee /usr/local/bin/tunnel_monitor.sh > /dev/null
          #!/bin/bash
          ERROR_THRESHOLD=5
          CHECK_INTERVAL=15
          HEALTH_CHECK_URL="http://127.0.0.1:8000/health"
          COOLDOWN=120
          LAST_SWAP=0
          CF_TOKEN_VAL=$(cat /tmp/.cf_token_ref 2>/dev/null)

          log() {
            echo "$(date '+%Y-%m-%d %H:%M:%S') $1" >> /tmp/tunnel_monitor.log
          }

          log "🚀 مانیتور شروع به کار کرد"

          while true; do
            sleep $CHECK_INTERVAL

            NOW=$(date +%s)
            SINCE_SWAP=$((NOW - LAST_SWAP))

            if [ "$SINCE_SWAP" -lt "$COOLDOWN" ]; then
              continue
            fi

            HEALTH=$(curl -sf -m 3 "$HEALTH_CHECK_URL" 2>/dev/null)
            NGINX_OK=$?

            RECENT_ERRORS=$(tail -100 /tmp/cf_tunnel.log 2>/dev/null | grep -ciE "EOF|stream error|timeout|connection reset|quic.*error|http2.*error|register tunnel|server misbehaving")

            CF_ALIVE=$(pgrep -c -f "cloudflared tunnel" 2>/dev/null || echo "0")

            NEED_SWAP=false

            if [ "$CF_ALIVE" -eq 0 ]; then
              log "💀 cloudflared مرده — نیاز به ری‌استارت"
              NEED_SWAP=true
            elif [ "$RECENT_ERRORS" -ge "$ERROR_THRESHOLD" ]; then
              log "⚠️ تعداد ارور بالا: $RECENT_ERRORS — نیاز به سوئیچ"
              NEED_SWAP=true
            fi

            if [ "$NEED_SWAP" = true ]; then
              CURRENT=$(cat /tmp/cf_proto.txt 2>/dev/null || echo "quic")

              if [ "$CURRENT" = "quic" ]; then
                NEXT="http2"
              else
                NEXT="quic"
              fi

              log "🔄 شروع Hot-Swap: $CURRENT → $NEXT"

              OLD_PID=$(pgrep -f "cloudflared tunnel" | head -1)

              sudo nohup /usr/local/bin/cloudflared tunnel \
                --protocol $NEXT \
                --url http://127.0.0.1:8000 \
                --no-autoupdate \
                --edge-ip-version 4 \
                --grace-period 25s \
                --retries 20 \
                run --token "$CF_TOKEN_VAL" > /tmp/cf_tunnel_new.log 2>&1 &
              NEW_PID=$!

              sleep 12

              if ps -p $NEW_PID > /dev/null 2>&1; then
                if [ -n "$OLD_PID" ]; then
                  sudo kill "$OLD_PID" 2>/dev/null
                  sleep 3
                  sudo kill -9 "$OLD_PID" 2>/dev/null
                fi

                echo "$NEXT" > /tmp/cf_proto.txt
                sudo cp /tmp/cf_tunnel_new.log /tmp/cf_tunnel.log
                LAST_SWAP=$NOW

                log "✅ Hot-Swap موفق: $NEXT فعال (بدون قطعی)"
              else
                log "❌ تونل جدید ($NEXT) ناموفق — ماندن روی $CURRENT"
                sudo kill "$NEW_PID" 2>/dev/null
              fi
            fi
          done
          MONITOR
          sudo chmod +x /usr/local/bin/tunnel_monitor.sh

          sudo nohup /usr/local/bin/tunnel_monitor.sh > /dev/null 2>&1 &
          echo "✅ مانیتور هوشمند فعال شد."

      - name: 6. Generate Connection Info & 6-Hour Keep Alive
        run: |
          VLESS_LINK="vless://$PRX_UUID@$PRX_DOMAIN:443?path=%2Fprx-stream&security=tls&encryption=none&type=ws&sni=$PRX_DOMAIN&host=$PRX_DOMAIN&alpn=h2%2Chttp%2F1.1&fp=chrome#PRX-Beast"

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  🔥 BEAST MODE WORKSTATION & PROXY IS RUNNING!         ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║                                                        ║"
          echo "║  🌐 Web Terminal:  https://$PRX_DOMAIN"
          echo "║  🔐 Login:         prxcore / [Secret Protected]        ║"
          echo "║                                                        ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🔥 Beast Mode Optimizations:                          ║"
          echo "║    ✅ BBR Congestion Control                           ║"
          echo "║    ✅ TCP Fast Open + No Delay                         ║"
          echo "║    ✅ SACK/DSACK/Timestamps (Fast Recovery)            ║"
          echo "║    ✅ 128MB Kernel Buffers (4x default)                ║"
          echo "║    ✅ tcp_notsent_lowat (Stream/Game Latency Fix)      ║"
          echo "║    ✅ Stable Keepalive (75s tolerance)                 ║"
          echo "║    ✅ Xray 64MB Buffer + BBR + MPTCP                  ║"
          echo "║    ✅ Xray 10min connIdle (No Random Drops)            ║"
          echo "║    ✅ Nginx 512 Upstream Keepalive                     ║"
          echo "║    ✅ 1M File Descriptors                              ║"
          echo "║    ✅ VM Swappiness=10 (Prefer RAM)                    ║"
          echo "║    ✅ Conservative Monitor (120s cooldown)             ║"
          echo "║    ✅ Smart Hot-Swap (Zero Downtime)                   ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🚀 VLESS Connection Link:                             ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "$VLESS_LINK"
          echo ""

          # ⚠️ QR Code حذف شد — دلیل: روی ریپوی عمومی گیت‌هاب نمی‌تونه ماسک بشه
          # اگه ریپوت Private هست و می‌خوای QR داشته باشی، خط زیر رو از کامنت دربیار:
          # qrencode -t ANSIUTF8 "$VLESS_LINK" 2>/dev/null || echo "(qrencode not available)"

          echo ""
          echo "⏱️ سرور تا ۶ ساعت فعال می‌ماند..."
          echo "=================================================="

          # Keep-Alive با نمایش وضعیت
          for i in $(seq 1 360); do
            sleep 60

            if [ $((i % 10)) -eq 0 ]; then
              PROTO=$(cat /tmp/cf_proto.txt 2>/dev/null || echo "unknown")
              CF_UP=$(pgrep -c -f "cloudflared tunnel" 2>/dev/null || echo "0")
              XRAY_UP=$(pgrep -c -f "xray" 2>/dev/null || echo "0")
              SWAP_COUNT=$(grep -c "Hot-Swap موفق" /tmp/tunnel_monitor.log 2>/dev/null || echo "0")

              echo "[$i/360] 📊 Status: Proto=$PROTO | CF=$CF_UP | Xray=$XRAY_UP | Swaps=$SWAP_COUNT"
            else
              echo "[$i/360] 🟢 Running on $PRX_DOMAIN"
            fi
          done

          echo "⏰ ۶ ساعت تمام شد. سرور خاموش می‌شود."
