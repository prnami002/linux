name: prxcore Ultra-Low Latency gRPC Workstation & Proxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. System & Network Tuning (BBR & Low Latency)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0
          sudo sysctl -w net.ipv4.tcp_notsent_lowat=16384
          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.core.wmem_max=67108864

      - name: 2. Setup User & Install Dependencies
        run: |
          sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:P@ssw0rd2026!" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y neofetch htop tmux curl wget nginx qrencode -qq

          # دانلود آخرین نسخه‌های ابزارهای ttyd و cloudflared
          sudo wget -q -nc https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          sudo wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: 3. Install & Configure Xray-Core (High-Speed gRPC Mode)
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          CLIENT_UUID="44e21daa-9908-4f2c-8d75-60b4fbe1b443"
          echo "CLIENT_UUID=$CLIENT_UUID" >> $GITHUB_ENV

          sudo mkdir -p /usr/local/etc/xray
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$CLIENT_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "grpc",
                  "grpcSettings": {
                    "serviceName": "prx-grpc",
                    "multiMode": true
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIP"
                }
              }
            ]
          }
          EOF

          sudo systemctl enable xray
          sudo systemctl restart xray

      - name: 4. Configure Nginx Unified HTTP/2 & gRPC Multiplexer
        run: |
          cat <<'EOF' | sudo tee /etc/nginx/sites-available/default
          server {
              listen 8000 http2 default_server;
              server_name _;
              client_max_body_size 0;

              # هدایت بسته‌های باینری پروتکل gRPC به هسته Xray
              location /prx-grpc {
                  grpc_pass grpc://127.0.0.1:8080;
                  grpc_read_timeout 86400s;
                  grpc_send_timeout 86400s;
                  client_body_buffer_size 1m;
              }

              # مسیر دسترسی به وب‌ترمینال در مرورگر
              location / {
                  proxy_pass http://127.0.0.1:7681;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_buffering off;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: 5. Launch Services & Dedicated Cloudflare Tunnel (QUIC Protocol)
        env:
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          # اجرای وب‌ترمینال روی پورت داخلی 7681
          sudo -u prxcore nohup /usr/local/bin/ttyd -W -p 7681 -t fontSize=16 -t theme="{'background': '#0f172a'}" -t rendererType=webgl tmux new-session -A -s prxcore_workspace > /tmp/ttyd.log 2>&1 &
          sleep 2

          # اجرای تونل رسمی کلودفلر با پروتکل پرسرعت QUIC
          sudo nohup /usr/local/bin/cloudflared tunnel --protocol quic --url http://127.0.0.1:8000 --no-autoupdate run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &

      - name: 6. Live Display & 6-Hour Keep Alive
        run: |
          VLESS_GRPC_LINK="vless://${{ env.CLIENT_UUID }}@edge.prnamilab.shop:443?mode=multi&security=tls&encryption=none&type=grpc&serviceName=prx-grpc&sni=edge.prnamilab.shop#PRX-gRPC-Dedicated"

          echo "=================================================="
          echo "🎉 ULTRA-LOW LATENCY gRPC SUITE IS ACTIVE!"
          echo "=================================================="
          echo "🌐 PERMANENT WEB TERMINAL: https://edge.prnamilab.shop"
          echo "=================================================="
          echo "🚀 VLESS gRPC CONFIG LINK:"
          echo "$VLESS_GRPC_LINK"
          echo "=================================================="

          for i in {1..360}; do
            sleep 60
            echo "[$i/360] 🟢 Server and gRPC proxy fully active on edge.prnamilab.shop"
          done
