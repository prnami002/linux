name: Linux SSH via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup User and Root Access
        run: |
          sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:P@ssw0rd2026!" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore

      - name: 2. Configure SSH Service
        run: |
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: 3. Download & Run Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url tcp://localhost:22 > cloudflare.log 2>&1 &
          sleep 10

      - name: 4. Extract Connection Info & Keep Alive (6 Hours)
        run: |
          TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cloudflare.log | head -n 1 | sed 's|https://||')
          echo "=================================================="
          echo " >>> LINUX SSH SERVER IS READY! <<<"
          echo " Cloudflare Host : $TUNNEL_URL"
          echo " Username        : prxcore"
          echo " Password        : P@ssw0rd2026!"
          echo "=================================================="
          
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] Server active..."
          done
