name: Neko WebRTC Remote Browser

on:
  workflow_dispatch:

jobs:
  launch-neko:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Deploy Neko Container (Chromium)
        run: |
          docker run -d \
            --name=neko-browser \
            --shm-size=2g \
            -p 8080:8080 \
            -e NEKO_SCREEN="1280x720@30" \
            -e NEKO_PASSWORD="user123" \
            -e NEKO_PASSWORD_ADMIN="admin123" \
            -e NEKO_ICELITE=1 \
            -e NEKO_ICESERVERS='[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]' \
            --restart unless-stopped \
            ghcr.io/m1k1o/neko/chromium:latest

      - name: 2. Start Cloudflare Quick Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          # اجرای تونل روی پورت 8080
          cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          # استخراج لینک موقت اتصال
          sleep 5
          for i in {1..15}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "=================================================="
              echo "  🚀 Neko WebRTC URL: $URL"
              echo "=================================================="
              break
            fi
            sleep 2
          done

      - name: 3. Keep Alive
        run: |
          echo "Neko is running. Keep this session alive."
          sleep 21600
