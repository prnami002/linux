name: prxcore High-Speed Dedicated Workstation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup User
        run: |
          sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:P@ssw0rd2026!" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore

      - name: 2. Install Enterprise Tools & tmux
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y neofetch htop tmux curl wget -qq
          sudo wget -q -nc https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          sudo wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: 3. Optimize Terminal for Ultra-Low Latency
        run: |
          sudo su - prxcore -c "echo 'set -sg escape-time 0' > ~/.tmux.conf"
          sudo su - prxcore -c "echo 'set -g mouse on' >> ~/.tmux.conf"
          sudo su - prxcore -c "echo 'set -g status-interval 1' >> ~/.tmux.conf"

      - name: 4. Launch ttyd on Dedicated Cloudflare Domain
        env:
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          # اجرای وب‌ترمینال روی پورت 7681
          sudo -u prxcore nohup /usr/local/bin/ttyd -W -p 7681 -t fontSize=16 -t theme="{'background': '#0f172a'}" -t rendererType=webgl -t disableLeaveAlert=true tmux new-session -A -s prxcore_workspace > /tmp/ttyd.log 2>&1 &
          sleep 2
          
          # اتصال مستقیم تونل رسمی دامنه شما به وب‌ترمینال
          sudo nohup /usr/local/bin/cloudflared tunnel --url http://127.0.0.1:7681 --no-autoupdate run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &

      - name: 5. Keep Alive (6 Hours)
        run: |
          echo "=================================================="
          echo " 🎉 HIGH-SPEED DEDICATED WORKSTATION IS LIVE!"
          echo "=================================================="
          echo "👉 PERMANENT WEB TERMINAL LINK:"
          echo "   https://edge.prnamilab.shop"
          echo "=================================================="
          
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] 🟢 Server active at https://edge.prnamilab.shop"
          done
