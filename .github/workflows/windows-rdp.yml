name: prxcore Ultra-Speed Server & Proxy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. System & Network Tuning (Low-Latency BBR)
        run: |
          # بهینه‌سازی شبکه لینوکس برای کاهش تأخیر و افزایش پکت‌های ارسالی
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.core.wmem_max=67108864
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864"

      - name: 2. Setup User & Dependencies
        run: |
          sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:P@ssw0rd2026!" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tmux curl wget qrencode -qq
          
          # دانلود ابزارها
          sudo wget -q -nc https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          sudo wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: 3. Install & Configure High-Performance Xray-Core
        run: |
          # نصب رسمی Xray با دسترسی روت
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          # تولید UUID ثابت برای ارتباط
          CLIENT_UUID="44e21daa-9908-4f2c-8d75-60b4fbe1b443"
          echo "CLIENT_UUID=$CLIENT_UUID" >> $GITHUB_ENV

          # اطمینان از وجود دایرکتوری کانفیگ
          sudo mkdir -p /usr/local/etc/xray

          # ساخت کانفیگ بهینه VLESS-WS روی پورت لوکال 8080
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$CLIENT_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/prx-stream"
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIP"
                }
              }
            ]
          }
          EOF

          sudo systemctl enable xray
          sudo systemctl restart xray

      - name: 4. Launch Services (Web Terminal & Cloudflare Dedicated Tunnel)
        env:
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          # اجرای ترمینال وب روی پورت 7681
          sudo -u prxcore nohup /usr/local/bin/ttyd -W -p 7681 -t fontSize=16 -t theme="{'background': '#0f172a'}" -t rendererType=webgl tmux new-session -A -s prxcore_workspace > /tmp/ttyd.log 2>&1 &
          
          # اجرای تونل سریع موقت فقط برای دسترسی به محیط وب‌ترمینال
          sudo nohup /usr/local/bin/cloudflared tunnel --url http://localhost:7681 > /tmp/cf_web.log 2>&1 &

          # اتصال تونل رسمی دائمی دامنه شما به پورت پروکسی Xray (8080)
          sudo nohup /usr/local/bin/cloudflared tunnel --no-autoupdate run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
          sleep 5

      - name: 5. Display Connection Info & Live Keep-Alive
        run: |
          WEB_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf_web.log | head -n 1)
          
          # ساخت لینک کلاینت VLESS
          VLESS_LINK="vless://${{ env.CLIENT_UUID }}@edge.prnamilab.shop:443?path=%2Fprx-stream&security=tls&encryption=none&type=ws&sni=edge.prnamilab.shop#PRX-GitHub-Dedicated"

          echo "=================================================="
          echo "🎉 ALL SERVICES ARE ONLINE!"
          echo "=================================================="
          echo "🌐 WEB TERMINAL URL: $WEB_URL"
          echo "=================================================="
          echo "🚀 VLESS CONFIG LINK (COPY AND IMPORT INTO APP):"
          echo ""
          echo "$VLESS_LINK"
          echo ""
          echo "=================================================="
          
          # نمایش کد QR در لاگ برای اسکن با گوشی
          qrencode -t ANSIUTF8 "$VLESS_LINK"

          # فعال نگه‌داشتن سرور تا ۶ ساعت
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] 🟢 Server running... edge.prnamilab.shop is active"
          done
