name: prxcore All-in-One Cloud Browser & Proxy Workstation (Ultra Low-Latency)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      PRX_DOMAIN: ${{ secrets.PRX_DOMAIN }}
      PRX_UUID: ${{ secrets.PRX_UUID }}
      PRX_USER_PASS: ${{ secrets.PRX_USER_PASS }}

    steps:
      - name: 1. Validate Secrets & Deep Kernel Network Tuning (BBR + Zero-Latency Buffers)
        run: |
          # --- اعتبارسنجی سکرت‌ها ---
          if [ -z "$CF_TOKEN" ] || [ -z "$PRX_DOMAIN" ] || [ -z "$PRX_UUID" ] || [ -z "$PRX_USER_PASS" ]; then
            echo "❌ خطا: لطفاً مطمئن شوید تمام سکرت‌ها (CF_TUNNEL_TOKEN, PRX_DOMAIN, PRX_UUID, PRX_USER_PASS) تنظیم شده‌اند."
            exit 1
          fi
          echo "✅ تمام سکرت‌ها تأیید شدند."

          # --- فعال‌سازی ماژول BBR ---
          sudo modprobe tcp_bbr 2>/dev/null || true
          echo "tcp_bbr" | sudo tee -a /etc/modules-load.d/bbr.conf > /dev/null

          # --- بهینه‌سازی پیشرفته کرنل برای کمترین لیتنسی و بالاترین استریم وب‌سوکت ---
          sudo tee /etc/sysctl.d/99-prxcore-optimize.conf > /dev/null <<'SYSCTL'
          # === BBR Congestion Control ===
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr

          # === TCP Fast Open ===
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_slow_start_after_idle = 0

          # === بافرهای بهینه (جلوگیری از Bufferbloat و حفظ رندر روان) ===
          net.core.rmem_default = 2097152
          net.core.rmem_max = 67108864
          net.core.wmem_default = 2097152
          net.core.wmem_max = 67108864
          net.ipv4.tcp_rmem = 4096 2097152 67108864
          net.ipv4.tcp_wmem = 4096 2097152 67108864
          net.core.somaxconn = 65535
          net.core.netdev_max_backlog = 250000

          # === بازیابی سریع پکت‌لاس (SACK / Timestamps) ===
          net.ipv4.tcp_sack = 1
          net.ipv4.tcp_dsack = 1
          net.ipv4.tcp_timestamps = 1
          net.ipv4.tcp_no_metrics_save = 1
          net.ipv4.tcp_frto = 2

          # === آزادسازی سریع سوکت‌ها ===
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_max_tw_buckets = 2000000

          # === TCP Keepalive بهینه برای حفظ مداوم استریم ===
          net.ipv4.tcp_keepalive_time = 30
          net.ipv4.tcp_keepalive_intvl = 5
          net.ipv4.tcp_keepalive_probes = 5

          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_syn_backlog = 65535
          net.ipv4.tcp_mtu_probing = 1
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.tcp_ecn = 0

          # غیرفعال‌سازی IPv6 جهت ثبات مسیر
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          SYSCTL

          sudo sysctl --system > /dev/null 2>&1
          echo "✅ بهینه‌سازی کرنل با موفقیت اعمال شد."

      - name: 2. Install Packages & CLI Tools
        run: |
          sudo useradd -m -s /bin/bash prxcore 2>/dev/null || true
          echo "prxcore:$PRX_USER_PASS" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore > /dev/null

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            htop tmux curl wget nginx jq docker.io -qq

          # دانلود آخرین نسخه cloudflared
          sudo wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          echo "✅ پکیج‌ها و ابزارهای موردنیاز نصب شدند."

      - name: 3. Launch Ultra-Fast Kasm Chromium Container
        run: |
          echo "🚀 در حال دریافت و اجرای کانتینر مرورگر Kasm..."
          
          # اجرای مرورگر با رزولوشن 1080p، پشتیبانی صدا و بافر حافظه مشترک 4 گیگابایت
          sudo docker run -d \
            --name kasm_chrome \
            --restart always \
            -p 6901:6901 \
            -e VNC_PW="$PRX_USER_PASS" \
            -e VNC_RESOLUTION="1920x1080" \
            -e VNC_VIEW_ONLY=0 \
            -e KASM_FORCE_AUDIO=1 \
            -e LC_ALL="C.UTF-8" \
            --shm-size=4g \
            kasmweb/chrome:1.15.0

          # انتظار برای راه‌اندازی کامل وب‌سرور داخلی Kasm
          echo "⏳ در حال آماده‌سازی مرورگر ابری..."
          for i in {1..30}; do
            if curl -k -s https://127.0.0.1:6901 > /dev/null; then
              echo "✅ مرورگر ابری Kasm با موفقیت بالا آمد."
              break
            fi
            sleep 2
          done

      - name: 4. Install & Configure Xray-Core (VLESS WS)
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          sudo mkdir -p /usr/local/etc/xray
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json
          {
            "log": {
              "loglevel": "none"
            },
            "dns": {
              "servers": [
                {
                  "address": "1.1.1.1",
                  "skipFallback": true
                },
                "8.8.8.8"
              ],
              "queryStrategy": "UseIPv4"
            },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$PRX_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/prx-stream",
                    "headers": {
                      "Host": "$PRX_DOMAIN"
                    }
                  },
                  "sockopt": {
                    "tcpFastOpen": true,
                    "tcpNoDelay": true,
                    "tcpCongestion": "bbr"
                  }
                },
                "sniffing": {
                  "enabled": true,
                  "destOverride": ["http", "tls"],
                  "routeOnly": true
                }
              }
            ],
            "outbounds": [
              {
                "tag": "direct",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIPv4"
                },
                "streamSettings": {
                  "sockopt": {
                    "tcpNoDelay": true,
                    "tcpCongestion": "bbr"
                  }
                }
              }
            ]
          }
          EOF

          sudo systemctl enable xray
          sudo systemctl restart xray
          sleep 2

          if sudo systemctl is-active --quiet xray; then
            echo "✅ سرویس Xray با موفقیت راه‌اندازی شد."
          else
            echo "❌ خطا در اجرای Xray!"
            exit 1
          fi

      - name: 5. Configure Nginx Multiplexer (Zero-Latency Streaming)
        run: |
          cat <<'MAIN' | sudo tee /etc/nginx/nginx.conf
          user www-data;
          worker_processes auto;
          worker_rlimit_nofile 131072;
          pid /run/nginx.pid;

          events {
              worker_connections 16384;
              multi_accept on;
              use epoll;
          }

          http {
              sendfile on;
              tcp_nopush off;
              tcp_nodelay on;
              types_hash_max_size 2048;
              server_tokens off;

              keepalive_timeout 120;
              keepalive_requests 100000;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
          MAIN

          cat <<'SITE' | sudo tee /etc/nginx/sites-available/default
          upstream kasm_backend {
              server 127.0.0.1:6901;
              keepalive 128;
          }

          upstream xray_backend {
              server 127.0.0.1:8080;
              keepalive 256;
          }

          server {
              listen 8000 default_server reuseport;
              server_name _;
              client_max_body_size 0;

              # === مسیر اصلی: مرورگر ابری Kasm (WebRTC / KasmVNC 60fps) ===
              location / {
                  proxy_pass https://kasm_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_ssl_verify off;

                  # خاموش کردن کامل بافر برای ارسال بلادرنگ فریم‌ها
                  proxy_buffering off;
                  proxy_request_buffering off;
                  tcp_nodelay on;

                  proxy_connect_timeout 5s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }

              # === مسیر پروکسی اختصاصی VLESS WS ===
              location /prx-stream {
                  proxy_redirect off;
                  proxy_pass http://xray_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_buffering off;
                  proxy_request_buffering off;
                  tcp_nodelay on;

                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === بررسی سلامت سیستم ===
              location /health {
                  access_log off;
                  default_type application/json;
                  return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
              }
          }
          SITE

          sudo nginx -t
          sudo systemctl restart nginx
          echo "✅ Nginx به عنوان سوئیچ کم‌تأخیر راه‌اندازی شد."

      - name: 6. Launch Smart Cloudflare Tunnel & Dynamic Monitor
        run: |
          CURRENT_PROTO="quic"
          echo "$CURRENT_PROTO" > /tmp/cf_proto.txt

          sudo nohup /usr/local/bin/cloudflared tunnel \
            --protocol $CURRENT_PROTO \
            --url http://127.0.0.1:8000 \
            --no-autoupdate \
            --edge-ip-version 4 \
            --grace-period 20s \
            --retries 15 \
            run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
          CF_PID=$!
          sleep 5

          if ps -p $CF_PID > /dev/null 2>&1; then
            echo "✅ تونل Cloudflare با پروتکل $CURRENT_PROTO شروع شد."
          else
            echo "⚠️ فالبک تونل به پروتکل HTTP/2..."
            CURRENT_PROTO="http2"
            echo "$CURRENT_PROTO" > /tmp/cf_proto.txt
            sudo nohup /usr/local/bin/cloudflared tunnel \
              --protocol $CURRENT_PROTO \
              --url http://127.0.0.1:8000 \
              --no-autoupdate \
              --edge-ip-version 4 \
              --grace-period 20s \
              --retries 15 \
              run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
            sleep 5
          fi

          echo "$CF_TOKEN" > /tmp/.cf_token
          chmod 600 /tmp/.cf_token

          cat <<'MONITOR' | sudo tee /usr/local/bin/tunnel_monitor.sh > /dev/null
          #!/bin/bash
          CF_TOKEN=$(cat /tmp/.cf_token 2>/dev/null)
          CHECK_INTERVAL=15
          COOLDOWN=90
          LAST_SWAP=0

          while true; do
            sleep $CHECK_INTERVAL
            NOW=$(date +%s)
            SINCE_SWAP=$((NOW - LAST_SWAP))

            if [ "$SINCE_SWAP" -lt "$COOLDOWN" ]; then
              continue
            fi

            RECENT_ERRORS=$(tail -100 /tmp/cf_tunnel.log 2>/dev/null | grep -ciE "EOF|stream error|timeout|connection reset|quic.*error|http2.*error|server misbehaving")
            CF_ALIVE=$(pgrep -c -f "cloudflared tunnel" 2>/dev/null || echo "0")

            if [ "$CF_ALIVE" -eq 0 ] || [ "$RECENT_ERRORS" -ge 5 ]; then
              CURRENT=$(cat /tmp/cf_proto.txt 2>/dev/null || echo "quic")
              NEXT=$([ "$CURRENT" = "quic" ] && echo "http2" || echo "quic")

              OLD_PID=$(pgrep -f "cloudflared tunnel" | head -1)
              sudo mv /tmp/cf_tunnel.log /tmp/cf_tunnel_old.log 2>/dev/null

              sudo nohup /usr/local/bin/cloudflared tunnel \
                --protocol $NEXT \
                --url http://127.0.0.1:8000 \
                --no-autoupdate \
                --edge-ip-version 4 \
                --grace-period 20s \
                --retries 15 \
                run --token "$CF_TOKEN" > /tmp/cf_tunnel.log 2>&1 &
              NEW_PID=$!
              sleep 8

              if ps -p $NEW_PID > /dev/null 2>&1; then
                [ -n "$OLD_PID" ] && sudo kill -9 "$OLD_PID" 2>/dev/null
                echo "$NEXT" > /tmp/cf_proto.txt
                LAST_SWAP=$NOW
              fi
            fi
          done
          MONITOR
          sudo chmod +x /usr/local/bin/tunnel_monitor.sh
          sudo nohup /usr/local/bin/tunnel_monitor.sh > /dev/null 2>&1 &
          echo "✅ مانیتور هوشمند سوئیچ پروتکل فعال شد."

      - name: 7. Output Access Credentials & 6-Hour Keep Alive
        run: |
          VLESS_LINK="vless://$PRX_UUID@$PRX_DOMAIN:443?path=%2Fprx-stream&security=tls&encryption=none&type=ws&sni=$PRX_DOMAIN&host=$PRX_DOMAIN&alpn=h2%2Chttp%2F1.1&fp=chrome#PRX-CloudBrowser"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════════════╗"
          echo "║   🎉 CLOUD BROWSER & ULTRA PROXY DEDICATED WORKSTATION IS READY!         ║"
          echo "╠══════════════════════════════════════════════════════════════════════════╣"
          echo "║                                                                          ║"
          printf "║  🌐 Cloud Browser (Kasm 60fps): https://%s\n" "$PRX_DOMAIN"
          echo "║  👤 Username:                   kasm_user                                ║"
          echo "║  🔐 Password:                   [PRX_USER_PASS Secret]                   ║"
          echo "║                                                                          ║"
          echo "╠══════════════════════════════════════════════════════════════════════════╣"
          echo "║  🚀 Fallback VLESS Link (For Local Clients):                             ║"
          echo "╚══════════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "$VLESS_LINK"
          echo ""
          echo "⏱️ سرور به مدت ۶ ساعت با بالاترین توان در دسترس شماست..."
          echo "=========================================================================="

          for i in $(seq 1 360); do
            sleep 60
            if [ $((i % 10)) -eq 0 ]; then
              PROTO=$(cat /tmp/cf_proto.txt 2>/dev/null || echo "unknown")
              echo "[$i/360] 📊 Server Status: Running (Proto: $PROTO) on https://$PRX_DOMAIN"
            fi
          done
