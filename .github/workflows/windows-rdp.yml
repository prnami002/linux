name: Quick Remote Browser

on:
  workflow_dispatch:

jobs:
  run-browser:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Deploy Chromium Container
        run: |
          docker run -d \
            --name=quick-browser \
            -p 3000:3000 \
            --shm-size=4g \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e LC_ALL=en_US.UTF-8 \
            --restart unless-stopped \
            lscr.io/linuxserver/chromium:latest

      - name: 2. Start Cloudflare Quick Tunnel
        run: |
          # دانلود و نصب آخرین نسخه cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          # اجرای کوییک تانل و ذخیره لاگ برای استخراج URL
          cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &

          # منتظر ماندن و استخراج لینک اتصال
          sleep 5
          for i in {1..15}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "=================================================="
              echo "  🚀 Remote Browser URL: $URL"
              echo "=================================================="
              break
            fi
            sleep 2
          done

      - name: 3. Keep Alive
        run: |
          echo "Browser is running. Keep this tab open or access via URL."
          sleep 21600
